name: Gersang Watchlist

on:
  schedule:
    - cron: '*/15 * * * *'   # 기본 수집 주기 — 항상 실행 (DB 유지용)
    - cron: '*/2 * * * *'    # 빠른 수집 주기 — FAST_MODE 변수가 true일 때만 실제로 실행됨
    - cron: '0 18 * * *'     # 매일 03:00 KST(=UTC 18:00 전날)에 워치리스트 갱신 + 오래된 데이터 정리
  workflow_dispatch:         # 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  collect:
    if: >
      github.event.schedule == '*/15 * * * *' ||
      (github.event.schedule == '*/2 * * * *' && vars.FAST_MODE == 'true') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run build-site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: collect-pages
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: collect-pages

  update-watchlist:
    if: github.event.schedule == '0 18 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run watchlist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run build-site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: watchlist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: watchlist-pages
