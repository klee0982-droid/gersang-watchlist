name: Gersang Watchlist

# 스케줄 트리거가 신규 저장소에서 몇 시간씩 인식이 지연되는 경우가 있음(GitHub
# 측 알려진 이슈) — 이 파일에 커밋이 새로 들어가면 재동기화되는 걸로 보고됨.
# 마지막 재동기화 시도: 2026-08-09 13:15 KST
on:
  schedule:
    - cron: '*/15 * * * *'   # 기본 수집 주기 — 항상 실행 (DB 유지용)
    - cron: '*/2 * * * *'    # 빠른 수집 주기 — FAST_MODE 변수가 true일 때만 실제로 실행됨
    - cron: '0 18 * * *'     # 매일 03:00 KST(=UTC 18:00 전날)에 워치리스트 갱신 + 오래된 데이터 정리
    - cron: '0 0 1 * *'      # 매달 1일 09:00 KST에 "아직 쓰시나요?" 점검 이슈 생성
  workflow_dispatch:         # 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  collect:
    if: >
      github.event.schedule == '*/15 * * * *' ||
      (github.event.schedule == '*/2 * * * *' && vars.FAST_MODE == 'true') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run build-site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: collect-pages
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: collect-pages

  update-watchlist:
    if: github.event.schedule == '0 18 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run watchlist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run build-site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: watchlist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: watchlist-pages

  monthly-checkin:
    if: github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(printf '이 저장소는 기본 15분 주기로 계속 자동 수집 중입니다 (FAST_MODE를 켠 상태라면 2분 주기).\n\n- **계속 쓰신다면**: 이 이슈는 그냥 닫아주세요.\n- **그만 쓰신다면**: repo → Settings → Actions → General → "Disable Actions"(또는 이 워크플로우만 Disable)로 꺼주세요. geota.co.kr로 나가는 요청과 Supabase 적재가 함께 멈춥니다.\n\n매달 1일에 자동으로 생성되는 알림입니다.')
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "월간 점검 — 거상 시세 모니터링, 계속 쓰시나요?" \
            --body "$BODY"
